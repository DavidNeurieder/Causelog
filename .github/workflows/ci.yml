name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy-test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Bundled SQLite builds C; keep it in the cache key.
          key: sqlite-bundled

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (unit, integration, e2e)
        run: cargo test --workspace

  e2e-browser:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: sqlite-bundled

      - name: Build server binary
        run: cargo build --bin causelog

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run browser E2E against the real binary
        working-directory: e2e
        env:
          CAUSELOG_BIN: ${{ github.workspace }}/target/debug/causelog
        run: npm run test:e2e

  audit:
    name: Security (cargo audit)
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # RUSTSEC-2023-0071 (rsa Marvin attack) is ignored because it comes from
      # sqlx-mysql's caching_sha2_password path, which Causelog never uses
      # (SQLite is bundled), and no fixed upgrade is available for rsa 0.9.x.
      # Revisit after sqlx updates its rsa pin.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2023-0071
