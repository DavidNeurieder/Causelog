name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/flutter.yml'

jobs:
  analyze-test:
    name: analyze · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze lib test

      - name: Test
        run: flutter test

  build:
    name: build · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            flutter build linux
            flutter build apk
          elif [ "$RUNNER_OS" = "macOS" ]; then
            flutter build macos
            flutter build ios --no-codesign
          elif [ "$RUNNER_OS" = "Windows" ]; then
            flutter build windows
          fi