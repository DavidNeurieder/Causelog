[package]
name = "causelog-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Causelog server: Axum app + askama templates + auth"

[[bin]]
name = "causelog"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
argon2 = { workspace = true }
askama = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
causelog-content = { version = "0.1.0", path = "../content" }
causelog-model = { version = "0.1.0", path = "../model" }
causelog-search = { version = "0.1.0", path = "../search" }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
rustls = { workspace = true }
rustls-acme = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["cookies", "json"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["process"] }
