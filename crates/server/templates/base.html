<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Causelog{% endblock %}</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site">
  <div class="container">
    <a class="brand" href="/">Causelog</a>
    {% if authed %}
    <nav class="site">
      <a href="/dashboard">Dashboard</a>
      <a href="/admin/users">Admin</a>
      <form method="get" action="/search" class="inline">
        <input class="search" type="search" name="q" placeholder="Search…" aria-label="Search">
      </form>
      <span class="who">{{ display_name }}</span>
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="link">Log out</button>
      </form>
    </nav>
    {% else %}
    <nav class="site">
      <a href="/login">Log in</a>
      <a href="/register">Register</a>
    </nav>
    {% endif %}
  </div>
</header>
<main class="container" id="main">
  {% if !flash.is_empty() %}<p class="notice {{ flash_kind }}">{{ flash }}</p>{% endif %}
  {% block content %}{% endblock %}
</main>
<footer class="site">
  <div class="container">
    <span>© {{ year }} Causelog</span>
  </div>
</footer>
</body>
</html>
