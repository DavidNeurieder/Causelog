# Kaizen — self-hosted deployment.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#   # first run: seed a demo user + project
#   docker compose -f deploy/docker-compose.yml run --rm kaizen seed-demo
#
# Your data lives in ./data/kaizen.db on the host. Back it up with
# deploy/backup.sh (see README for restore).

services:
  kaizen:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: kaizen
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: sqlite:///data/kaizen.db
      KAIZEN_ADDR: 0.0.0.0:8080
      # HTTPS with a real certificate? Point Kaizen at your reverse proxy and
      # set KAIZEN_ADDR behind it, or mount a cert/key and use:
      #   KAIZEN_TLS_CERT: /certs/fullchain.pem
      #   KAIZEN_TLS_KEY:  /certs/privkey.pem
    volumes:
      - ./data:/data
      # - ./certs:/certs:ro   # when using KAIZEN_TLS_CERT/KAIZEN_TLS_KEY
